AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Tier 2 (edge) - ECR repositories, Application Load Balancer with
  path-based routing, and the ECS Fargate cluster.

Parameters:
  EnvironmentName:
    Type: String
    Default: threetier-app
  BackendContainerPort:
    Type: Number
    Default: 5000

Resources:
  FrontendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${EnvironmentName}-frontend
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Expire untagged images after 7 days",
              "selection": {"tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 7},
              "action": {"type": "expire"}
            }]
          }

  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${EnvironmentName}-backend
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Expire untagged images after 7 days",
              "selection": {"tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 7},
              "action": {"type": "expire"}
            }]
          }

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${EnvironmentName}-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${EnvironmentName}-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - Fn::ImportValue: !Sub "${EnvironmentName}-PublicSubnet1Id"
        - Fn::ImportValue: !Sub "${EnvironmentName}-PublicSubnet2Id"
      SecurityGroups:
        - Fn::ImportValue: !Sub "${EnvironmentName}-ALBSecurityGroupId"

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${EnvironmentName}-frontend-tg
      Port: 80
      Protocol: HTTP
      TargetType: ip
      VpcId:
        Fn::ImportValue: !Sub "${EnvironmentName}-VpcId"
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${EnvironmentName}-backend-tg
      Port: !Ref BackendContainerPort
      Protocol: HTTP
      TargetType: ip
      VpcId:
        Fn::ImportValue: !Sub "${EnvironmentName}-VpcId"
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  ApiRoutingRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          Values: ["/api/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

Outputs:
  ClusterName:
    Value: !Ref ECSCluster
    Export: { Name: !Sub "${EnvironmentName}-ClusterName" }
  ClusterArn:
    Value: !GetAtt ECSCluster.Arn
    Export: { Name: !Sub "${EnvironmentName}-ClusterArn" }
  ALBDNSName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export: { Name: !Sub "${EnvironmentName}-ALBDNSName" }
  HttpListenerArn:
    Value: !Ref HttpListener
    Export: { Name: !Sub "${EnvironmentName}-HttpListenerArn" }
  FrontendTargetGroupArn:
    Value: !Ref FrontendTargetGroup
    Export: { Name: !Sub "${EnvironmentName}-FrontendTargetGroupArn" }
  BackendTargetGroupArn:
    Value: !Ref BackendTargetGroup
    Export: { Name: !Sub "${EnvironmentName}-BackendTargetGroupArn" }
  FrontendRepositoryUri:
    Value: !GetAtt FrontendRepository.RepositoryUri
    Export: { Name: !Sub "${EnvironmentName}-FrontendRepositoryUri" }
  BackendRepositoryUri:
    Value: !GetAtt BackendRepository.RepositoryUri
    Export: { Name: !Sub "${EnvironmentName}-BackendRepositoryUri" }
  FrontendRepositoryName:
    Value: !Ref FrontendRepository
    Export: { Name: !Sub "${EnvironmentName}-FrontendRepositoryName" }
  BackendRepositoryName:
    Value: !Ref BackendRepository
    Export: { Name: !Sub "${EnvironmentName}-BackendRepositoryName" }
